name: ois-search-prototype
services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: ois_demo
      POSTGRES_PASSWORD: ois_demo_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ois_demo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9207:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
volumes:
  postgres-data:
  opensearch-data:
